<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Íconico Roleplay</title>
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b9dff" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#1450c8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crownL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4efff"/><stop offset=".5" stop-color="#5cb8ff"/><stop offset="1" stop-color="#1c6fe0"/>
    </linearGradient>
    <linearGradient id="crownD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc7ff"/><stop offset="1" stop-color="#0f4fc0"/>
    </linearGradient>
    <linearGradient id="pavL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#0a3a9a"/>
    </linearGradient>
    <linearGradient id="pavD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d63d6"/><stop offset="1" stop-color="#06256e"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7ff"/><stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#9fd6ff"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#d7dee9"/>
      <stop offset=".46" stop-color="#8794aa"/>
      <stop offset=".6" stop-color="#f6f8fc"/>
      <stop offset=".82" stop-color="#a7b3c5"/>
      <stop offset="1" stop-color="#5f6c82"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000814" flood-opacity=".75"/>
    </filter>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0-10C1 -2 2 -1 10 0 2 1 1 2 0 10-1 2-2 1-10 0-2-1-1-2 0-10Z" fill="#fff"/>
    </symbol>
  </defs>

  <circle cx="256" cy="250" r="250" fill="url(#aura)"/>

  <!-- Diamante -->
  <g filter="url(#shadow)">
    <!-- Corona -->
    <polygon points="132,108 380,108 452,196 60,196" fill="url(#crownD)"/>
    <polygon points="132,108 186,196 60,196" fill="url(#crownL)"/>
    <polygon points="132,108 256,108 186,196" fill="#9ad4ff"/>
    <polygon points="256,108 186,196 326,196" fill="url(#table)"/>
    <polygon points="256,108 380,108 326,196" fill="#5aaeff"/>
    <polygon points="380,108 452,196 326,196" fill="url(#crownD)"/>
    <!-- Pabellón -->
    <polygon points="60,196 186,196 256,396" fill="url(#pavL)"/>
    <polygon points="186,196 326,196 256,396" fill="url(#pavD)"/>
    <polygon points="326,196 452,196 256,396" fill="url(#pavL)"/>
    <polygon points="186,196 256,196 256,396" fill="#2f86f2" opacity=".55"/>
    <!-- Aristas -->
    <g fill="none" stroke="#d6f0ff" stroke-width="2" stroke-linejoin="round" opacity=".75">
      <polyline points="132,108 186,196 256,108 326,196 380,108"/>
      <line x1="60" y1="196" x2="452" y2="196"/>
      <polyline points="186,196 256,396 326,196"/>
      <line x1="256" y1="196" x2="256" y2="396" opacity=".5"/>
    </g>
    <polygon points="132,108 380,108 452,196 256,396 60,196" fill="none" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="140,114 250,114 186,186" fill="url(#shine)" opacity=".55"/>
  </g>

  <!-- La I plateada -->
  <g transform="translate(46 0) skewX(-12)" filter="url(#shadow)">
    <path d="M190,58 H326 L320,90 C302,93 293,99 291,114 V320 C293,335 302,341 320,344 L326,376 H190 L196,344 C214,341 223,335 225,320 V114 C223,99 214,93 196,90 Z"
          fill="url(#silver)" stroke="#141c2b" stroke-width="7" stroke-linejoin="round"/>
    <path d="M200,66 H316 L313,82 C296,85 287,92 284,106 L252,106 C250,92 235,85 205,82 Z" fill="#fff" opacity=".55"/>
    <path d="M233,118 V318" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- Destellos -->
  <g filter="url(#glow)">
    <use href="#spark" x="88" y="160" width="34" height="34"/>
    <use href="#spark" x="352" y="118" width="26" height="26"/>
    <use href="#spark" x="388" y="186" width="18" height="18"/>
    <use href="#spark" x="300" y="44" width="30" height="30"/>
    <use href="#spark" x="246" y="372" width="22" height="22"/>
  </g>
</svg>
